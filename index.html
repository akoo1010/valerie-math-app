<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valerie's Math Adventure 🌟</title>
    <meta name="description" content="A fun, personalized 3rd grade math learning app with swimming, Geometry Dash, and arts & crafts themes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Splash / Loading Screen -->
    <div id="screen-splash" class="screen active">
        <div class="splash-content">
            <div class="splash-bubbles" id="splash-bubbles"></div>
            <h1 class="splash-title">Valerie's<br><span class="title-highlight">Math Adventure</span></h1>
            <div class="splash-mascot">🧜‍♀️</div>
            <p class="splash-subtitle">Dive into 3rd Grade Math!</p>
            <button class="btn btn-start" id="btn-start" onclick="App.showMap()">
                <span class="btn-icon">🚀</span> Let's Go!
            </button>
        </div>
    </div>

    <!-- World Map Screen -->
    <div id="screen-map" class="screen">
        <div class="map-header">
            <div class="map-header-left">
                <h2 class="map-title">🗺️ Adventure Map</h2>
                <p class="map-welcome">Hi Valerie! Choose a world to explore!</p>
            </div>
            <div class="map-header-right">
                <div class="stats-badge" id="total-stars">⭐ 0</div>
                <button class="btn btn-small btn-practice" onclick="App.showPracticeZone()">🔄 Practice Zone</button>
            </div>
        </div>
        <div class="map-grid" id="map-grid">
            <!-- Units generated by JS -->
        </div>
    </div>

    <!-- Unit Intro Screen -->
    <div id="screen-unit-intro" class="screen">
        <button class="btn-back" onclick="App.showMap()">← Back to Map</button>
        <div class="unit-intro-content" id="unit-intro-content">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Exercise Screen -->
    <div id="screen-exercise" class="screen">
        <div class="exercise-header">
            <button class="btn-back" onclick="App.confirmExit()">← Back</button>
            <div class="exercise-progress">
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="exercise-progress-bar"></div>
                </div>
                <span class="progress-text" id="exercise-progress-text">1/7</span>
            </div>
            <div class="exercise-stars" id="exercise-stars">⭐ 0</div>
        </div>
        <div class="exercise-body" id="exercise-body">
            <!-- Populated by exercise engine -->
        </div>
        <div class="exercise-feedback" id="exercise-feedback">
            <!-- Feedback overlay -->
        </div>
    </div>

    <!-- Results Screen -->
    <div id="screen-results" class="screen">
        <div class="results-content" id="results-content">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Practice Zone Screen -->
    <div id="screen-practice" class="screen">
        <button class="btn-back" onclick="App.showMap()">← Back to Map</button>
        <div class="practice-content" id="practice-content">
            <h2 class="practice-title">🔄 Practice Zone</h2>
            <p class="practice-desc">Let's practice the tricky ones, Valerie!</p>
            <div id="practice-body"></div>
        </div>
    </div>

    <!-- Celebration Canvas (overlays everything) -->
    <canvas id="celebration-canvas"></canvas>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/adaptive.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/units/multiplication.js"></script>
    <script src="js/units/multiplication-1digit.js"></script>
    <script src="js/units/addition-subtraction.js"></script>
    <script src="js/units/division.js"></script>
    <script src="js/units/fractions.js"></script>
    <script src="js/units/patterns.js"></script>
    <script src="js/units/geometry.js"></script>
    <script src="js/units/area.js"></script>
    <script src="js/units/perimeter.js"></script>
    <script src="js/units/time.js"></script>
    <script src="js/units/measurement.js"></script>
    <script src="js/units/data-graphs.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
